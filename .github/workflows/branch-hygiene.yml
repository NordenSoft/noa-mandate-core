name: branch-hygiene

# STRANDED-BRANCH SWEEP. Runs on a schedule, not on push, because the defect it looks for is an
# ABSENCE: a branch tip that was pushed without a current open pull request emits no review event.
# Nothing on the push path can catch it — by the time it matters, the push is weeks in the past.
#
# Manual sweeps can find stranded work, but they are incomplete and non-repeatable. This scheduled
# job derives the branch and pull-request state mechanically so hidden work becomes a reviewable
# finding instead of depending on organizational memory.
#
# It writes to a single tracking issue rather than failing the default branch, because a red X on
# `main` for something that is not `main`'s fault teaches people to ignore red X's.

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily — off the hour, so it does not queue behind everyone else's cron
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read      # the sweep must prove an exact same-repository open PR at the current tip
  issues: write            # the report IS the output; without this the job can only fail silently

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REQUIRED, but not trusted by itself. The gate also compares every local origin-tracking
          # ref with two authoritative `ls-remote` snapshots and refuses partial/racing views.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Prove the gate can still fail
        # Runs BEFORE the real sweep, every time. A hygiene job that has quietly stopped measuring
        # reports a clean repository, which is indistinguishable from success and worse than no job.
        run: node scripts/lint-stranded-branches.mjs --selftest

      - name: Materialize every authoritative remote head
        env:
          GH_TOKEN: ${{ github.token }}
        # fetch-depth: 0 supplies full history. This separate exact positive refspec supplies every
        # provider head as refs/remotes/origin/*; the Node contract compares it with stable A/B
        # ls-remote snapshots and fails on any missing, extra, changed, or malformed ref.
        run: node scripts/lint-stranded-branches.mjs --prepare-github-actions-refs

      - name: Sweep for stranded branches
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
        # One Node process measures, writes the report, safely publishes the tilde-fenced summary,
        # and emits exact 0/1 outputs. UNKNOWN or any publication failure exits nonzero.
        run: node scripts/lint-stranded-branches.mjs --github-actions --grace-days 3

      - name: Validate sweep outcome
        # `always()` makes missing output and a failed sweep visible instead of letting all later
        # conditional steps skip. Only an actually successful sweep carrying exact code 0 or 1 may
        # reach issue reconciliation.
        if: always()
        env:
          SWEEP_CODE: ${{ steps.sweep.outputs.code }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
          SWEEP_REPORT: ${{ steps.sweep.outputs.report }}
        run: node scripts/lint-stranded-branches.mjs --validate-github-actions-output

      - name: Open or update the tracking issue
        if: steps.sweep.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ steps.sweep.outputs.report }}
        run: |
          set -euo pipefail
          TITLE="Branch hygiene: live branch tips without qualifying pull-request evidence"
          BODY_FILE=issue.md
          {
            echo "Branches below carry commits \`main\` does not have, without a same-repository OPEN PR for their exact current tip."
            echo "No qualifying current pull-request review is recorded at those exact tips."
            echo
            echo '~~~text'
            cat "$REPORT_FILE"
            echo '~~~'
            echo
            echo "Updated automatically by \`.github/workflows/branch-hygiene.yml\` — run \`$GITHUB_RUN_ID\`."
          } > "$BODY_FILE"

          NUM="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                 --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$BODY_FILE"
            echo "updated issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Close the tracking issue when the sweep is clean
        # Symmetry matters: an issue that only ever opens becomes wallpaper. This one closes itself
        # the day the repository is clean, so its presence always means something is outstanding.
        if: steps.sweep.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Branch hygiene: live branch tips without qualifying pull-request evidence"
          NUM="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                 --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Sweep is clean: no authoritative provider branch violates the open-PR/grace policy."
            echo "closed issue #$NUM"
          else
            echo "clean, and no open issue to close"
          fi
