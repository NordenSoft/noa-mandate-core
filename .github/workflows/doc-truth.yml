name: doc-truth

# The README is the one document a stranger reads before they trust anything else here, and until
# 634a043 it was the only claim surface in this repository that no machine checked. It drifted exactly
# the way an unchecked document drifts: it advertised `noa-receipt` 0.6.0 while the registry served
# 0.6.2, it carried a hand-counted test total, and it told readers to run `npx noa` — a package name
# that belongs to an unrelated third party. Every one of those was written honestly and became false
# while CI stayed green. SECURITY.md drifted the exact same way for the exact same reason (it stated
# `noa-receipt` 0.6.1 while the registry served 0.6.2), so `scripts/lint-doc-truth.mjs` now judges
# every document listed in its own `GATED_DOCUMENTS` constant, not just the README — this workflow's
# two commands are unchanged; only the script's internal scope grew. It reads each file the way a
# reader does: it resolves the links, it re-derives the counts from the repository, it asks the
# registry for the versions, and it EXECUTES the quickstart against the published package (the README
# only — no other gated document currently claims one).
#
# It lives in its own workflow rather than inside `ci.yml`, on the pr-title.yml pattern: it is small
# and fast (~1 minute, dominated by one npm install), it needs the npm registry but none of the
# matrix's toolchains, and a README-only edit should not have to wait for the five-language
# conformance matrix to say whether the front page is honest.

on:
  pull_request:
    # `edited` is not available for file content, so `synchronize` is what re-runs this after a
    # README fix. `opened`/`reopened` cover the rest.
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      # Anti-vacuity, and it runs FIRST. The fixtures are hermetic — no network, no filesystem, no
      # shell — and they run in BOTH directions: READMEs that must be rejected AND READMEs that must
      # be accepted. The must-pass half is what stops an over-eager regex from blocking honest text
      # such as the spec id `noa.receipt/0.1` or the sentence that WARNS about `npx noa`. Each
      # must-fail fixture also has to be caught by EXACTLY the rule it was written for, so a fixture
      # cannot keep passing for an unrelated reason after its rule is deleted.
      #
      # If any of that misbehaves the job stops here and renders NO verdict on the real README: a
      # check that could not run and a check that passed must never share an exit code.
      - name: Prove the gate can fail before letting it judge
        run: node scripts/lint-doc-truth.mjs --selftest

      # No `--no-network` escape hatch: the registry IS the truth for a published version, so an
      # unreachable registry exits 2 (could-not-run), never 0. This judges every document in
      # GATED_DOCUMENTS (currently README.md and SECURITY.md) and exits non-zero if ANY of them fails.
      - name: Judge every gated document against the repository, the registry and a real shell
        run: node scripts/lint-doc-truth.mjs

      # Every workflow file is a claim surface too: GitHub runs no job of a workflow file it cannot
      # parse, so a broken file stops producing its checks without any red. actionlint reads every
      # file under .github/workflows, syntax and expression checks only (shellcheck and pyflakes
      # off). The one ignored message class is the Ubicloud runner label family, which actionlint
      # does not know. ACTIONLINT_SHA256 is the linux_amd64 line of the release's own
      # actionlint_1.7.12_checksums.txt, equal to GitHub's digest of that asset. actionlint exits 1
      # on any finding, 2 on a bad option and 3 on a fatal error (its docs/usage.md, "Exit status").
      - name: Lint every workflow file with actionlint (pinned release, sha256-verified)
        shell: bash
        timeout-minutes: 3
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          bin_dir="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 60 --output "$bin_dir/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$bin_dir/$tarball" | sha256sum --check --strict -
          tar -xzf "$bin_dir/$tarball" -C "$bin_dir" actionlint
          "$bin_dir/actionlint" -version
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ "${#workflows[@]}" -eq 0 ]; then echo "::error::no workflow file under .github/workflows"; exit 1; fi
          "$bin_dir/actionlint" -shellcheck= -pyflakes= \
            -ignore 'label "ubicloud-standard-[0-9]+(-arm)?(-ubuntu-[0-9]+)?" is unknown' \
            "${workflows[@]}"
          echo "actionlint ${ACTIONLINT_VERSION}: ${#workflows[@]} workflow file(s) clean"
